name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg2://postgres:postgres@localhost:5432/portal_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # slim-data and slim-domain come from their GitHub repos (pyproject.toml); the report engine
      # too, so the bridge tests run instead of skipping.
      - run: pip install -e ".[dev]" "slim-report-engine @ git+https://github.com/Firehawk41/slim-report-engine-oss@main"
      - run: pytest -q
