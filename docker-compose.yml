# Local development: the portal plus Postgres.
# The full ecosystem compose (portal + slim-lims + Caddy) comes in a later step.
services:
  portal:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/slim
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slim"]
      interval: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
