[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-lab-portal"
version = "0.1.0"
description = "Sample submission portal for the SLIM LIMS ecosystem"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
    "pydantic[email]>=2.6,<3.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["slim_lab_portal*"]

[tool.setuptools.package-data]
slim_lab_portal = ["templates/**/*", "static/**/*", "migrations/**/*", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
